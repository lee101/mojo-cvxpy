[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-cvxpy"
version = "0.1.0"
description = "Mojo acceleration for CVXPY problem canonicalization"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "cvxpy"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
